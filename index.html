            --accent: #ff007f;
            --yellow: #ffb703;
            --text-main: #ffffff;
            --text-sub: #d0c8e8;
        }

        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        
        header { 
            background: linear-gradient(135deg, #1c0b30, #090210); 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 3px solid var(--primary); 
            position: relative; 
        }
        
        .logo-img {
            max-width: 130px;
            height: auto;
            margin-bottom: 8px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .subtitle { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .info-bar { display: flex; justify-content: center; gap: 15px; font-size: 12px; margin-top: 10px; color: var(--yellow); flex-wrap: wrap; }
        .info-bar span { display: flex; align-items: center; gap: 5px; }
        
        .nav-container { display: flex; overflow-x: auto; padding: 12px 10px; background: #07020d; gap: 8px; position: sticky; top: 0; z-index: 90; }
        .nav-container::-webkit-scrollbar { display: none; }
        .nav-btn { background: var(--card-bg); border: 1px solid #4a2380; color: var(--text-main); padding: 8px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { background: var(--primary); color: #000; font-weight: bold; border-color: var(--primary); }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .menu-card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #3c196e; display: flex; justify-content: space-between; align-items: center; }
        .card-info { flex: 1; padding-right: 10px; }
        .card-name { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .card-price { font-size: 16px; font-weight: 800; color: var(--primary); margin-top: 6px; }
        
        .add-btn { background: linear-gradient(135deg, #00d2ff, #0072ff); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
        
        /* Modal QR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%; border: 2px solid var(--primary); }
        #qrcode { margin: 20px auto; padding: 10px; background: #fff; border-radius: 8px; display: inline-block; }
        
        /* Bar del Pedido */
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #07020d; border-top: 2px solid var(--primary); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .cart-info { color: #fff; font-size: 14px; }
        .cart-total { font-size: 18px; font-weight: bold; color: var(--yellow); }
        .send-btn { background: #25d366; color: #fff; border: none; padding: 10px 18px; border-radius: 25px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; font-size: 14px; }

let cart = {};

function renderMenu(items) {
    const container = document.getElementById('menu-items');
    container.innerHTML = items.map(item => `
        <div class="menu-card">
            <div class="card-info">
                <div class="card-name">${item.name}</div>
                <div class="card-price">S/ ${item.price.toFixed(2)}</div>
            </div>
            <button class="add-btn" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})"><i class="fas fa-plus"></i></button>
        </div>
    `).join('');
}

function addToCart(name, price) {
    if (cart[name]) { cart[name].qty += 1; }
    else { cart[name] = { price, qty: 1 }; }
    updateCart();
}

function updateCart() {
    let total = 0; let count = 0;
    for (let key in cart) {
        total += cart[key].price * cart[key].qty;
        count += cart[key].qty;
    }
    document.getElementById('cart-total').innerText = `S/ ${total.toFixed(2)}`;
    document.getElementById('item-count').innerText = `${count} producto(s)`;
}

function filterCategory(cat) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (cat === 'todos') renderMenu(menuData);
    else renderMenu(menuData.filter(i => i.cat === cat));
}

function sendWhatsApp() {
    let msg = "¡Hola D'Peñas Cevichería! Quisiera realizar el siguiente pedido:\n\n";
    let total = 0;
    for (let key in cart) {
        let sub = cart[key].price * cart[key].qty;
        total += sub;
        msg += `• ${cart[key].qty}x ${key} - S/ ${sub.toFixed(2)}\n`;
    }
    if (total === 0) { alert('Por favor, selecciona al menos un plato.'); return; }
    msg += `\n*Total a pagar: S/ ${total.toFixed(2)}*`;
    window.open(`https://wa.me/51954025848?text=${encodeURIComponent(msg)}`, '_blank');
}

function openQR() {
    document.getElementById('qrModal').style.display = 'flex';
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 150, height: 150 });
}
function closeQR() { document.getElementById('qrModal').style.display = 'none'; }

renderMenu(menuData);
